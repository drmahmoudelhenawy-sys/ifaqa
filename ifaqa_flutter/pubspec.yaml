name: ifaqa_flutter
description: "إفاقة: رفيقك اليومي للصلوات والأذكار والتحديات الإيمانية."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  adhan: ^2.0.0+1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  geolocator: ^14.1.2
  http: ^1.2.2
  just_audio: ^0.9.42
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo-300.ttf
          weight: 300
        - asset: assets/fonts/cairo-400.ttf
          weight: 400
        - asset: assets/fonts/cairo-500.ttf
          weight: 500
        - asset: assets/fonts/cairo-700.ttf
          weight: 700
        - asset: assets/fonts/cairo-900.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri-400.ttf
